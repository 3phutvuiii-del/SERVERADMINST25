version: '3.8'

services:
  adminpanel-st25:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adminpanel_st25
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.local
    volumes:
      - ./data:/app/data
